groups:
  - name: student-accommodation-alerts
    rules:
      - alert: InstanceDown
        expr: up{job="student-accommodation"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Application is down"
          description: "Prometheus cannot scrape {{ $labels.instance }} for over 30 seconds."

      - alert: HighErrorRate
        expr: sum(rate(http_requests_total{status_code=~"5.."}[1m])) / sum(rate(http_requests_total[1m])) > 0.05
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of requests are failing with 5xx"

      - alert: HighLatencyP95
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[1m])) by (le)) > 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "95th percentile latency is above 1 second"