name: sas-prod
services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    container_name: sas-prod-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/sas_production
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      - mongo
  mongo:
    image: mongo:6
    container_name: sas-prod-mongo
    restart: unless-stopped
    volumes:
      - prod-mongo-data:/data/db
  prometheus:
    build: ./monitoring
    container_name: sas-prod-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    depends_on:
      - app
  grafana:
    image: grafana/grafana:11.1.0
    container_name: sas-prod-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-changeme}
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
volumes:
  prod-mongo-data:
  grafana-data: