services:
  app:
    build: .
    restart: on-failure
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/student_accomodation_system_hd
      - JWT_SECRET=replace-with-a-long-random-secret
    depends_on:
      - mongo
  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
volumes:
  mongo-data: